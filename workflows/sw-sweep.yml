# Cezar workflow run hourly by the "sw: przegląd co godzinę" automation in the
# sw-control repository. The gate (bin/sw-gate, no agent) checks runtime health
# and decides what to start in this cycle. On "URUCHOM: GENERATOR" the sw-generator
# agent tries up to ideaAttemptsPerCycle ideas (the loop max below; a test keeps it
# equal to config/sw.json); a failed attempt is written to the journal, the first
# good one becomes an idea card and bin/sw-start-ocena starts its sw-ocena task.
# On "URUCHOM: OCENA <nr>" (an evaluation task that got lost, e.g. after a Cezar
# restart) sw-start-ocena starts a new task for that idea. On "URUCHOM: SPEC <nr>"
# (an approved idea without a repository) bin/sw-create-repo creates the private
# application repository and starts its sw-spec task; sw-spec then leads to
# sw-build or to the handover, by the stage switch in config/sw.json.
#
# A broken runtime ends the task with status success on purpose: cezar-push
# alerts the owner for every task entering "failed", and the spec allows no
# such messages. The failure is visible in the gate output; repeated failures
# are reported once by a later step (spec, technical sections, etap 1).
#
# Run as an autonomous task.

version: 2
name: sw-sweep
description: Godzinny przegląd roju. Bramka sprawdza stan i decyduje, co uruchomić w tym cyklu.

nodes:
  - id: start
    type: start

  - id: gate
    type: check
    name: Bramka przeglądu
    command: bash "${SW_HOME:-$HOME/swarm-of-agents}/bin/sw-gate"

  - id: is-generator
    type: if
    name: Brak aktywnego projektu?
    condition: { kind: output, ref: gate.output, op: contains, value: "URUCHOM: GENERATOR" }

  - id: attempts
    type: loop
    name: Próby generowania pomysłu
    max: 5

  - id: generator
    type: agent
    name: Generator pomysłów
    skill: sw-generator
    runner: claude
    model: opus
    prompt: |
      Wczytaj skill sw-generator i wykonaj jedną próbę (próba {{nodes.attempts.iteration}} z {{nodes.attempts.max}}).
    allowedTools: [Read, Write, WebSearch, WebFetch]
    bashAllowlist: []
    verdicts: [karta, nieudana]

  - id: card
    type: check
    name: Karta pomysłu
    command: bash "${SW_HOME:-$HOME/swarm-of-agents}/bin/sw-idea-card" karta

  - id: is-ocena
    type: if
    name: Zaginione zadanie oceny?
    condition: { kind: output, ref: gate.output, op: contains, value: "URUCHOM: OCENA" }

  - id: is-spec
    type: if
    name: Zatwierdzony pomysł bez repozytorium?
    condition: { kind: output, ref: gate.output, op: contains, value: "URUCHOM: SPEC" }

  - id: create-repo
    type: check
    name: Repozytorium i specyfikacja aplikacji
    command: bash "${SW_HOME:-$HOME/swarm-of-agents}/bin/sw-create-repo"

  - id: card-created
    type: if
    name: Powstała nowa karta?
    condition: { kind: output, ref: card.output, op: contains, value: "WYNIK: KARTA" }

  - id: start-ocena
    type: check
    name: Zadanie oceny pomysłu
    command: bash "${SW_HOME:-$HOME/swarm-of-agents}/bin/sw-start-ocena"

  - id: card-rejected
    type: if
    name: Próba odrzucona przez skrypt?
    condition: { kind: output, ref: card.output, op: contains, value: "WYNIK: NIEUDANA" }

  - id: failed-attempt
    type: check
    name: Nieudana próba w dzienniku
    command: bash "${SW_HOME:-$HOME/swarm-of-agents}/bin/sw-idea-card" nieudana

  - id: no-idea
    type: check
    name: Wpis „brak pomysłu”
    command: bash "${SW_HOME:-$HOME/swarm-of-agents}/bin/sw-log" "brak pomysłu"

  - id: done
    type: end
    status: success

  - id: degraded
    type: end
    status: success

edges:
  - { from: start, to: gate }
  - { from: gate.pass, to: is-generator }
  - { from: is-generator.true, to: attempts }
  - { from: is-generator.false, to: is-ocena }
  - { from: is-ocena.true, to: start-ocena }
  - { from: is-ocena.false, to: is-spec }
  - { from: is-spec.true, to: create-repo }
  - { from: is-spec.false, to: done }
  - { from: create-repo.pass, to: done }
  - { from: create-repo.fail, to: degraded }
  - { from: attempts.repeat, to: generator }
  - { from: attempts.exhausted, to: no-idea }
  - { from: generator.karta, to: card }
  - { from: generator.nieudana, to: failed-attempt }
  - { from: generator.failed, to: failed-attempt }
  - { from: card.pass, to: card-rejected }
  - { from: card.fail, to: degraded }
  - { from: card-rejected.true, to: attempts }
  - { from: card-rejected.false, to: card-created }
  - { from: card-created.true, to: start-ocena }
  - { from: card-created.false, to: done }
  - { from: start-ocena.pass, to: done }
  - { from: start-ocena.fail, to: degraded }
  - { from: failed-attempt.pass, to: attempts }
  - { from: failed-attempt.fail, to: degraded }
  - { from: no-idea.pass, to: done }
  - { from: no-idea.fail, to: degraded }
  - { from: gate.fail, to: degraded }
