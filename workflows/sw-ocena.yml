# Cezar workflow of one idea evaluation (spec S2/S3), started by bin/sw-start-ocena
# as a NON-autonomous task in the sw-control project: the owner opens the push
# notification in cezar-pwa and talks to the analyst. The agent only reads the
# card and writes one comment (sw:ustalenia or sw:odrzucenie); it cannot change
# labels: gh issue edit and every other state change are outside bashAllowlist.
# The decision is read from the task history and applied by the check node
# after the agent (sw-ocena-wynik), never taken from the agent's own words.
#
# The analyst node is not the terminal agent (the result check follows), so Cezar
# waits for the owner only after a turn that ends with a CEZ:ASK line; a turn with a
# plain question would end the node at once. The skill therefore ends EVERY turn
# before the decision with CEZ:ASK (tests/unit/sw_ocena_skill.bats). Cezar's idle
# timeout (resources.idleTimeoutMinutes) also closes a parked ask; the owner sets it
# to 0 on the VPS (README), otherwise an evaluation ends after that many minutes.
#
# A failed agent turn ends with status success on purpose (no failure
# notification, see sw-sweep): the gate finds the unfinished evaluation and
# starts a new task (URUCHOM: OCENA <nr>).

version: 2
name: sw-ocena
description: Rozmowa analityka z właścicielem o pomyśle i karta decyzji Zatwierdź / Odrzuć.

nodes:
  - id: start
    type: start

  - id: analyst
    type: agent
    name: Analityk (ocena pomysłu)
    skill: sw-analityk
    runner: claude
    model: opus
    prompt: |
      Wczytaj skill sw-analityk i pracuj w trybie ocena. Numer issue z kartą pomysłu jest w treści zadania.

      Zadanie: {{task}}
    allowedTools: [Read, Write, Bash]
    bashAllowlist:
      - "gh issue view"
      - "gh issue comment"
      - "mktemp"

  - id: result
    type: check
    name: Decyzja właściciela
    command: bash "${SW_HOME:-$HOME/swarm-of-agents}/bin/sw-ocena-wynik"

  - id: done
    type: end
    status: success

  - id: degraded
    type: end
    status: success

edges:
  - { from: start, to: analyst }
  - { from: analyst.done, to: result }
  - { from: result.pass, to: done }
  - { from: result.fail, to: degraded }
  - { from: analyst.failed, to: degraded }
