# Cezar workflow of the build of a new application (spec S5 one module, S7 E2E of the whole application, S8; stage 2).
# bin/sw-build-start starts it as an AUTONOMOUS task in the application project once the
# specification is merged (config/sw.json "stage" 2) with the text "Budowa aplikacji:
# <control>#<nr>"; the project is then in sw-stan-architektura. sw-create-repo seeds the
# file in the application repository (.ai/cezar/workflows).
#
# Every step starts with the check sw-limits (the "limits-*" nodes): over its time or usage
# limit the project is paused (sw-pause) and the task ends.
# 1. sw-architekt (one module): stack, docs/kontrakty/<module>.md, every scenario assigned
#    to a module, skeleton and the CI workflow with the check-runs of requiredChecks;
#    commit, push and a draft PR follow.
#    bin/sw-architektura-check then verifies what must not rest on the agent alone: the
#    contract sections, every scenario assigned to a module, the CI jobs named like
#    requiredChecks; problems start a fix round (.ai/sw-run/uwagi.md) of the architect.
# 2. sw-recenzent (mode kod, a different model than the architect) gives "approve" or
#    "changes"; "changes" and a red CI start a fix round of the architect, at most
#    fixRoundsPerPr times (the loop max below; a test keeps it equal to config/sw.json).
#    The remarks travel in .ai/sw-run/uwagi.md.
# 3. github.wait-ci waits for the CI of the pushed commit, sw-bezpieczenstwo (mode kod)
#    gives "pass" or "fail".
# 4. bin/sw-spec-pr merge-kod runs sw-merge kod: verdicts and run ids from node outputs,
#    models from the Cezar run records, the SHA captured before the review, green
#    check-runs of requiredChecks for that SHA.
#
#    After the merge bin/sw-moduly opens the issue "Moduł: <modul>" (sw-modul, sw-modul-do-zrobienia)
#    for every contract (spec S5, many modules).
# 5. Module (spec S6, S7; stage 2 has ONE module, so no dispatch): the project goes to
#    sw-stan-implementacja (bin/sw-stan), bin/sw-kierownik przydziel moves the modules to
#    sw-modul-w-pracy at most as many as maxParallelAgents leaves free (it also sets the limit as
#    maxParallel of the project; the module is back to sw-modul-zmergowany at kierownik-merged
#    after the merge of its PR), sw-inzynier implements the module and writes a test
#    for every "udostępnia" item and an E2E test for every scenario; commit, push and a draft
#    PR follow. bin/sw-pokrycie-check modul verifies the "## Pokrycie" of the contract (a test
#    file for every item); remarks start a fix round of the engineer (rounds-mod). Then the
#    same pipeline as for the architecture: sw-recenzent, github.wait-ci, sw-bezpieczenstwo,
#    sw-merge kod (rounds-mod and pause-security-mod).
# 5b. Integration (S7, stage 3): sw-stan-integracja, then bin/sw-integracja gotowe creates the
#    integration task only when every module issue is sw-modul-zmergowany. sw-integrator (model
#    integrator) assembles the merged modules into the running application: "zlozona" goes
#    through a NEW PR (review, CI, security, merge), "bez-zmian" straight on (once-integ: the
#    first assembly happens once). bin/sw-integracja spojnosc then checks conflict markers and
#    the Wymaga/Udostępnia fit of the contracts; a conflict starts a fix round of the integrator
#    (rounds-integ, fixRoundsPerPr, its fix through a NEW PR), exhausted rounds pause the project.
# 6. Tests of the whole application (S7): sw-stan-integracja, bin/sw-pokrycie-check e2e (every
#    scenario of the specification named in a test of tests/e2e, none skipped), the real run of
#    scripts/test-e2e.sh, sw-tester judging whether the tests check the criteria. A failure or
#    a remark starts a fix round of the engineer (rounds-test); its fix goes through a NEW PR
#    (review, CI, security, merge) and the tests run again. Only green E2E and the verdict
#    "pass" move the project to sw-stan-przeglad. Exhausted rounds pause the project.
#
# 7. Security review of the whole application (S9): after sw-stan-przeglad, sw-bezpieczenstwo
#    (mode aplikacja) judges four points and writes them to .ai/sw-run/przeglad.json;
#    bin/sw-przeglad decides (the verdict AND all four points, secrets also scanned by the
#    script) and on "pass" writes docs/security/<date>-raport.md. The report goes through a PR
#    of the module pipeline (review, CI, security, merge); the merged report ends the task,
#    so nothing is deployed before it. On "fail" a fix round of the engineer
#    (rounds-app) starts: its fix goes through a NEW PR, the tests and the review run again.
#    Exhausted rounds pause the project.
#
# 8. Deployment (S10): sw-stan-wdrazanie, bin/sw-deploy (container on the VPS under the private
#    address deploy.bindAddress, the only entry a proxy with login; the denial test of a request
#    without login; a failure removes everything it started), then bin/sw-wdrozony: state
#    sw-stan-wdrozony, the issue of the idea closed (the generator starts in the next cycle) and
#    a notification with the title and the address. A failed deployment is retried at most
#    retriesPerTask times (rounds-deploy; a test keeps it equal to config/sw.json), then the
#    project is paused.
#
# Every ending without a merge ends the task with status success on purpose (cezar-push
# alerts the owner for every failed task, and the spec allows no such messages). The
# exceptions are the pauses (S11): exhausted fix rounds and a failed security review go
# through bin/sw-spec-pr pause (label sw-stan-wstrzymany, pauseReason, idea closed,
# journal entry and one "blocked" notification). The PR stays unmerged.
#
# Run as an autonomous task.

version: 2
name: sw-build
description: Architekt przygotowuje architekturę z jednym modułem, inżynier go implementuje z testami, każdy PR przechodzi niezależną recenzję, CI i przegląd bezpieczeństwa oraz sw-merge kod, a tester sprawdza E2E pełnej aplikacji przed przejściem projektu w przegląd.

nodes:
  - id: start
    type: start

  - id: limits-architect
    type: check
    name: Limity projektu (przed architektem)
    command: |
      out="$(bash "${SW_HOME:-$HOME/swarm-of-agents}/bin/sw-limits")"; rc=$?; printf '%s\n' "$out"
      [ "$rc" -eq 0 ] && [[ "$out" == *"WYNIK: OK"* ]]

  - id: architect
    type: agent
    name: Architekt (jeden moduł)
    skill: sw-architekt
    runner: claude
    model: opus
    prompt: |
      Wczytaj skill sw-architekt i pracuj w trybie architektura: pierwszy zapis.

      Zadanie: {{task}}
    allowedTools: [Read, Write, Edit, Bash]
    bashAllowlist:
      - "gh issue view"
      - "ls"
      - "cat"
      - "mkdir"
      - "chmod"
      - "git ls-files"
      - "bash scripts/"
    verdicts: [gotowa]

  - id: commit
    type: git.commit
    name: Commit architektury
    message: "feat: architektura, moduł, szkielet i CI aplikacji"

  - id: push
    type: git.push
    name: Push architektury

  - id: draft-pr
    type: github.draft-pr
    name: PR architektury
    title: "feat: architektura, moduł, szkielet i CI aplikacji"

  - id: arch-check
    type: check
    name: Kontrakt, przypisanie scenariuszy i CI
    command: bash "${SW_HOME:-$HOME/swarm-of-agents}/bin/sw-architektura-check"

  - id: sha
    type: check
    name: SHA ocenianej wersji
    command: bash "${SW_HOME:-$HOME/swarm-of-agents}/bin/sw-spec-pr" sha

  - id: limits-review
    type: check
    name: Limity projektu (przed recenzją)
    command: |
      out="$(bash "${SW_HOME:-$HOME/swarm-of-agents}/bin/sw-limits")"; rc=$?; printf '%s\n' "$out"
      [ "$rc" -eq 0 ] && [[ "$out" == *"WYNIK: OK"* ]]

  - id: review
    type: agent
    name: Recenzent (kod)
    skill: sw-recenzent
    runner: claude
    model: sonnet
    prompt: |
      Wczytaj skill sw-recenzent i zrecenzuj PR architektury w trybie kod.

      Zadanie: {{task}}
    allowedTools: [Read, Write, Bash]
    bashAllowlist:
      - "gh issue view"
      - "gh pr diff"
      - "git diff"
      - "ls"
      - "cat"
    verdicts: [approve, changes]

  - id: ci
    type: github.wait-ci
    name: CI commita (check-runy requiredChecks)

  - id: rounds
    type: loop
    name: Rundy poprawek architektury
    max: 3

  - id: limits-fix
    type: check
    name: Limity projektu (przed poprawką)
    command: |
      out="$(bash "${SW_HOME:-$HOME/swarm-of-agents}/bin/sw-limits")"; rc=$?; printf '%s\n' "$out"
      [ "$rc" -eq 0 ] && [[ "$out" == *"WYNIK: OK"* ]]

  - id: fix
    type: agent
    name: Architekt (poprawka po uwagach albo czerwonym CI)
    skill: sw-architekt
    runner: claude
    model: opus
    prompt: |
      Wczytaj skill sw-architekt i pracuj w trybie architektura: poprawka po uwagach recenzenta
      albo po czerwonym CI (runda poprawek {{nodes.rounds.iteration}} z {{nodes.rounds.max}}).
      Uwagi są w .ai/sw-run/uwagi.md. Gdy go nie ma, przyczyną jest czerwone CI: sprawdź je
      poleceniem gh pr checks.

      Zadanie: {{task}}
    allowedTools: [Read, Write, Edit, Bash]
    bashAllowlist:
      - "gh issue view"
      - "gh pr checks"
      - "ls"
      - "cat"
      - "mkdir"
      - "chmod"
      - "git ls-files"
      - "bash scripts/"
    verdicts: [gotowa]

  - id: arch-check-fix
    type: check
    name: Kontrakt, przypisanie scenariuszy i CI (po poprawce)
    command: bash "${SW_HOME:-$HOME/swarm-of-agents}/bin/sw-architektura-check"

  - id: commit-fix
    type: git.commit
    name: Commit poprawek
    message: "fix: poprawki architektury po recenzji albo CI"

  - id: push-fix
    type: git.push
    name: Push poprawek

  - id: security
    type: agent
    name: Bezpieczeństwo (kod w PR)
    skill: sw-bezpieczenstwo
    runner: claude
    model: sonnet
    prompt: |
      Wczytaj skill sw-bezpieczenstwo i pracuj w trybie kod.

      Zadanie: {{task}}
    allowedTools: [Read, Bash]
    bashAllowlist:
      - "gh issue view"
      - "git diff"
      - "ls"
    verdicts: [pass, fail]

  - id: limits-merge
    type: check
    name: Limity projektu (przed merge'em)
    command: |
      out="$(bash "${SW_HOME:-$HOME/swarm-of-agents}/bin/sw-limits")"; rc=$?; printf '%s\n' "$out"
      [ "$rc" -eq 0 ] && [[ "$out" == *"WYNIK: OK"* ]]

  - id: merge
    type: check
    name: Merge architektury (sw-merge kod)
    command: |
      bash "${SW_HOME:-$HOME/swarm-of-agents}/bin/sw-spec-pr" merge-kod '{{nodes.sha.output}}' \
        --werdykt "autor={{nodes.architect.verdict}}@{{nodes.architect.runId}}" \
        --werdykt "recenzent={{nodes.review.verdict}}@{{nodes.review.runId}}" \
        --werdykt "bezpieczenstwo={{nodes.security.verdict}}@{{nodes.security.runId}}"

  - id: pause-rounds
    type: check
    name: Wstrzymanie projektu po wyczerpaniu rund poprawek
    command: |
      bash "${SW_HOME:-$HOME/swarm-of-agents}/bin/sw-spec-pr" pause 'architektura: uwagi albo czerwone CI po wyczerpaniu rund poprawek'

  - id: pause-security
    type: check
    name: Wstrzymanie projektu po porażce przeglądu bezpieczeństwa
    command: |
      bash "${SW_HOME:-$HOME/swarm-of-agents}/bin/sw-spec-pr" pause 'przegląd bezpieczeństwa architektury: fail'

  - id: moduly
    type: check
    name: Issues modułów (sw-modul-do-zrobienia)
    command: bash "${SW_HOME:-$HOME/swarm-of-agents}/bin/sw-moduly" zaloz

  - id: state-impl
    type: check
    name: Stan projektu - implementacja
    command: bash "${SW_HOME:-$HOME/swarm-of-agents}/bin/sw-stan" architektura implementacja

  - id: kierownik
    type: check
    name: Przydział modułów do limitu agentów (sw-kierownik)
    command: bash "${SW_HOME:-$HOME/swarm-of-agents}/bin/sw-kierownik" przydziel

  - id: limits-engineer
    type: check
    name: Limity projektu (przed inżynierem)
    command: |
      out="$(bash "${SW_HOME:-$HOME/swarm-of-agents}/bin/sw-limits")"; rc=$?; printf '%s\n' "$out"
      [ "$rc" -eq 0 ] && [[ "$out" == *"WYNIK: OK"* ]]

  - id: engineer
    type: agent
    name: Inżynier (moduł)
    skill: sw-inzynier
    runner: claude
    model: opus
    prompt: |
      Wczytaj skill sw-inzynier i pracuj w trybie implementacja: pierwszy zapis modułu.

      Zadanie: {{task}}
    allowedTools: [Read, Write, Edit, Bash]
    bashAllowlist:
      - "gh issue view"
      - "gh pr checks"
      - "ls"
      - "cat"
      - "mkdir"
      - "chmod"
      - "git ls-files"
      - "bash scripts/"
    verdicts: [gotowa]

  - id: commit-mod
    type: git.commit
    name: Commit modułu
    message: "feat: implementacja modułu i testy E2E aplikacji"

  - id: push-mod
    type: git.push
    name: Push modułu

  - id: pr-mod
    type: github.draft-pr
    name: PR modułu
    title: "feat: implementacja modułu i testy E2E aplikacji"

  - id: mod-check
    type: check
    name: Test dla każdej pozycji udostępnia
    command: bash "${SW_HOME:-$HOME/swarm-of-agents}/bin/sw-pokrycie-check" modul

  - id: sha-mod
    type: check
    name: SHA ocenianej wersji modułu
    command: bash "${SW_HOME:-$HOME/swarm-of-agents}/bin/sw-spec-pr" sha

  - id: limits-review-mod
    type: check
    name: Limity projektu (przed recenzją modułu)
    command: |
      out="$(bash "${SW_HOME:-$HOME/swarm-of-agents}/bin/sw-limits")"; rc=$?; printf '%s\n' "$out"
      [ "$rc" -eq 0 ] && [[ "$out" == *"WYNIK: OK"* ]]

  - id: review-mod
    type: agent
    name: Recenzent (kod modułu)
    skill: sw-recenzent
    runner: claude
    model: sonnet
    prompt: |
      Wczytaj skill sw-recenzent i zrecenzuj PR modułu w trybie kod (sekcja „PR modułu”).

      Zadanie: {{task}}
    allowedTools: [Read, Write, Bash]
    bashAllowlist:
      - "gh issue view"
      - "gh pr diff"
      - "git diff"
      - "ls"
      - "cat"
    verdicts: [approve, changes]

  - id: ci-mod
    type: github.wait-ci
    name: CI commita modułu (check-runy requiredChecks)

  - id: rounds-mod
    type: loop
    name: Rundy poprawek modułu
    max: 3

  - id: limits-fix-mod
    type: check
    name: Limity projektu (przed poprawką modułu)
    command: |
      out="$(bash "${SW_HOME:-$HOME/swarm-of-agents}/bin/sw-limits")"; rc=$?; printf '%s\n' "$out"
      [ "$rc" -eq 0 ] && [[ "$out" == *"WYNIK: OK"* ]]

  - id: fix-mod
    type: agent
    name: Inżynier (poprawka po uwagach albo czerwonym CI)
    skill: sw-inzynier
    runner: claude
    model: opus
    prompt: |
      Wczytaj skill sw-inzynier i pracuj w trybie poprawka: uwagi recenzenta, sprawdzenia pokrycia
      albo czerwone CI (runda poprawek {{nodes.rounds-mod.iteration}} z {{nodes.rounds-mod.max}}).
      Uwagi są w .ai/sw-run/uwagi.md. Gdy go nie ma, przyczyną jest czerwone CI: sprawdź je
      poleceniem gh pr checks.

      Zadanie: {{task}}
    allowedTools: [Read, Write, Edit, Bash]
    bashAllowlist:
      - "gh issue view"
      - "gh pr checks"
      - "ls"
      - "cat"
      - "mkdir"
      - "chmod"
      - "git ls-files"
      - "bash scripts/"
    verdicts: [gotowa]

  - id: mod-check-fix
    type: check
    name: Test dla każdej pozycji udostępnia (po poprawce)
    command: bash "${SW_HOME:-$HOME/swarm-of-agents}/bin/sw-pokrycie-check" modul

  - id: commit-fix-mod
    type: git.commit
    name: Commit poprawek modułu
    message: "fix: poprawki modułu po recenzji albo CI"

  - id: push-fix-mod
    type: git.push
    name: Push poprawek modułu

  - id: security-mod
    type: agent
    name: Bezpieczeństwo (kod modułu)
    skill: sw-bezpieczenstwo
    runner: claude
    model: sonnet
    prompt: |
      Wczytaj skill sw-bezpieczenstwo i pracuj w trybie kod na PR modułu.

      Zadanie: {{task}}
    allowedTools: [Read, Bash]
    bashAllowlist:
      - "gh issue view"
      - "git diff"
      - "ls"
    verdicts: [pass, fail]

  - id: limits-merge-mod
    type: check
    name: Limity projektu (przed merge'em modułu)
    command: |
      out="$(bash "${SW_HOME:-$HOME/swarm-of-agents}/bin/sw-limits")"; rc=$?; printf '%s\n' "$out"
      [ "$rc" -eq 0 ] && [[ "$out" == *"WYNIK: OK"* ]]

  - id: merge-mod
    type: check
    name: Merge modułu (sw-merge kod)
    command: |
      bash "${SW_HOME:-$HOME/swarm-of-agents}/bin/sw-spec-pr" merge-kod '{{nodes.sha-mod.output}}' \
        --werdykt "autor={{nodes.engineer.verdict}}@{{nodes.engineer.runId}}" \
        --werdykt "recenzent={{nodes.review-mod.verdict}}@{{nodes.review-mod.runId}}" \
        --werdykt "bezpieczenstwo={{nodes.security-mod.verdict}}@{{nodes.security-mod.runId}}"

  - id: kierownik-merged
    type: check
    name: Moduł zmergowany (sw-kierownik)
    command: |
      for f in docs/kontrakty/*.md; do
        m="$(basename "$f" .md)"
        [ "${m,,}" = readme ] && continue
        bash "${SW_HOME:-$HOME/swarm-of-agents}/bin/sw-kierownik" zmergowany "$m" || exit 1
      done

  - id: state-integ
    type: check
    name: Stan projektu - integracja
    command: bash "${SW_HOME:-$HOME/swarm-of-agents}/bin/sw-stan" implementacja integracja

  - id: integ-ready
    type: check
    name: Wszystkie moduły zmergowane (zadanie integracji)
    command: bash "${SW_HOME:-$HOME/swarm-of-agents}/bin/sw-integracja" gotowe

  - id: once-integ
    type: loop
    name: Pierwsze złożenie modułów najwyżej raz
    max: 1

  - id: limits-integrator
    type: check
    name: Limity projektu (przed integratorem)
    command: |
      out="$(bash "${SW_HOME:-$HOME/swarm-of-agents}/bin/sw-limits")"; rc=$?; printf '%s\n' "$out"
      [ "$rc" -eq 0 ] && [[ "$out" == *"WYNIK: OK"* ]]

  - id: integrator
    type: agent
    name: Integrator (złożenie zmergowanych modułów w aplikację)
    skill: sw-integrator
    runner: claude
    model: opus
    prompt: |
      Wczytaj skill sw-integrator i pracuj w trybie integracja: wszystkie moduły są zmergowane,
      złóż je w działającą aplikację. Zmiany trafią do nowego PR, który przechodzi recenzję,
      CI i przegląd bezpieczeństwa.

      Zadanie: {{task}}
    allowedTools: [Read, Write, Edit, Bash]
    bashAllowlist:
      - "gh issue view"
      - "gh pr checks"
      - "ls"
      - "cat"
      - "mkdir"
      - "chmod"
      - "git ls-files"
      - "bash scripts/"
      - "bash bin/sw-integracja"
    verdicts: [zlozona, bez-zmian]

  - id: integ-check
    type: check
    name: Spójność modułów (konflikty, kontrakty Wymaga i Udostępnia)
    command: bash "${SW_HOME:-$HOME/swarm-of-agents}/bin/sw-integracja" spojnosc

  - id: rounds-integ
    type: loop
    name: Rundy poprawek po konflikcie modułów
    max: 3

  - id: limits-fix-integ
    type: check
    name: Limity projektu (przed poprawką integracji)
    command: |
      out="$(bash "${SW_HOME:-$HOME/swarm-of-agents}/bin/sw-limits")"; rc=$?; printf '%s\n' "$out"
      [ "$rc" -eq 0 ] && [[ "$out" == *"WYNIK: OK"* ]]

  - id: fix-integ
    type: agent
    name: Integrator (poprawka po konflikcie modułów)
    skill: sw-integrator
    runner: claude
    model: opus
    prompt: |
      Wczytaj skill sw-integrator i pracuj w trybie poprawka: konflikt modułów albo rozbieżność
      kontraktów (runda poprawek {{nodes.rounds-integ.iteration}} z {{nodes.rounds-integ.max}}).
      Uwagi są w .ai/sw-run/uwagi.md. Poprawka trafia do nowego PR, który przechodzi recenzję, CI
      i przegląd bezpieczeństwa.

      Zadanie: {{task}}
    allowedTools: [Read, Write, Edit, Bash]
    bashAllowlist:
      - "gh issue view"
      - "gh pr checks"
      - "ls"
      - "cat"
      - "mkdir"
      - "chmod"
      - "git ls-files"
      - "bash scripts/"
      - "bash bin/sw-integracja"
    verdicts: [gotowa]

  - id: limits-test
    type: check
    name: Limity projektu (przed testami E2E)
    command: |
      out="$(bash "${SW_HOME:-$HOME/swarm-of-agents}/bin/sw-limits")"; rc=$?; printf '%s\n' "$out"
      [ "$rc" -eq 0 ] && [[ "$out" == *"WYNIK: OK"* ]]

  - id: e2e-check
    type: check
    name: Test E2E dla każdego scenariusza specyfikacji
    command: bash "${SW_HOME:-$HOME/swarm-of-agents}/bin/sw-pokrycie-check" e2e

  - id: e2e-run
    type: check
    name: Testy E2E pełnej aplikacji
    command: |
      mkdir -p .ai/sw-run
      log="$(mktemp)"
      timeout 1800 bash scripts/test-e2e.sh > "$log" 2>&1; rc=$?
      tail -n 60 "$log"
      if [ "$rc" -ne 0 ]; then
        { echo "1. Testy E2E (scripts/test-e2e.sh) nie przechodzą, kod wyjścia $rc. Koniec wyjścia:"; tail -n 40 "$log" | sed 's/^/   /'; } > .ai/sw-run/uwagi.md
      fi
      rm -f "$log"
      exit "$rc"

  - id: limits-tester
    type: check
    name: Limity projektu (przed testerem)
    command: |
      out="$(bash "${SW_HOME:-$HOME/swarm-of-agents}/bin/sw-limits")"; rc=$?; printf '%s\n' "$out"
      [ "$rc" -eq 0 ] && [[ "$out" == *"WYNIK: OK"* ]]

  - id: tester
    type: agent
    name: Tester (E2E pełnej aplikacji)
    skill: sw-tester
    runner: claude
    model: sonnet
    prompt: |
      Wczytaj skill sw-tester i oceń testy E2E pełnej aplikacji po merge'u modułu.

      Zadanie: {{task}}
    allowedTools: [Read, Write, Bash]
    bashAllowlist:
      - "ls"
      - "cat"
      - "bash scripts/"
    verdicts: [pass, fail]

  - id: rounds-test
    type: loop
    name: Rundy poprawek po testach E2E
    max: 3

  - id: limits-fix-test
    type: check
    name: Limity projektu (przed poprawką po testach)
    command: |
      out="$(bash "${SW_HOME:-$HOME/swarm-of-agents}/bin/sw-limits")"; rc=$?; printf '%s\n' "$out"
      [ "$rc" -eq 0 ] && [[ "$out" == *"WYNIK: OK"* ]]

  - id: fix-test
    type: agent
    name: Inżynier (poprawka po raporcie testów E2E)
    skill: sw-inzynier
    runner: claude
    model: opus
    prompt: |
      Wczytaj skill sw-inzynier i pracuj w trybie poprawka: brakujące albo padające testy E2E
      pełnej aplikacji (runda poprawek {{nodes.rounds-test.iteration}} z {{nodes.rounds-test.max}}).
      Raport testów, testera albo sprawdzenia pokrycia jest w .ai/sw-run/uwagi.md.
      Poprawka trafia do nowego PR, który przechodzi recenzję, CI i przegląd bezpieczeństwa.

      Zadanie: {{task}}
    allowedTools: [Read, Write, Edit, Bash]
    bashAllowlist:
      - "gh issue view"
      - "gh pr checks"
      - "ls"
      - "cat"
      - "mkdir"
      - "chmod"
      - "git ls-files"
      - "bash scripts/"
    verdicts: [gotowa]

  - id: state-review
    type: check
    name: Stan projektu - przegląd
    command: bash "${SW_HOME:-$HOME/swarm-of-agents}/bin/sw-stan" integracja przeglad

  - id: limits-app
    type: check
    name: Limity projektu (przed przeglądem bezpieczeństwa aplikacji)
    command: |
      out="$(bash "${SW_HOME:-$HOME/swarm-of-agents}/bin/sw-limits")"; rc=$?; printf '%s\n' "$out"
      [ "$rc" -eq 0 ] && [[ "$out" == *"WYNIK: OK"* ]]

  - id: security-app
    type: agent
    name: Bezpieczeństwo (pełna aplikacja)
    skill: sw-bezpieczenstwo
    runner: claude
    model: sonnet
    prompt: |
      Wczytaj skill sw-bezpieczenstwo i pracuj w trybie aplikacja (przegląd przed wdrożeniem, cztery punkty).
      Wynik punktów zapisz w .ai/sw-run/przeglad.json.

      Zadanie: {{task}}
    allowedTools: [Read, Write, Bash]
    bashAllowlist:
      - "gh issue view"
      - "git ls-files"
      - "ls"
      - "cat"
      - "mkdir"
    verdicts: [pass, fail]

  - id: app-check
    type: check
    name: Werdykt przeglądu aplikacji i raport (sw-przeglad)
    command: bash "${SW_HOME:-$HOME/swarm-of-agents}/bin/sw-przeglad" '{{nodes.security-app.verdict}}'

  - id: once-report
    type: loop
    name: Raport z przeglądu trafia do PR najwyżej raz
    max: 1

  - id: commit-report
    type: git.commit
    name: Commit raportu z przeglądu bezpieczeństwa
    message: "docs: raport z przeglądu bezpieczeństwa aplikacji"

  - id: report-merged
    type: check
    name: Raport z przeglądu jest w zmergowanym kodzie
    command: ls docs/security/*-raport.md

  - id: rounds-app
    type: loop
    name: Rundy poprawek po przeglądzie bezpieczeństwa aplikacji
    max: 3

  - id: limits-fix-app
    type: check
    name: Limity projektu (przed poprawką po przeglądzie aplikacji)
    command: |
      out="$(bash "${SW_HOME:-$HOME/swarm-of-agents}/bin/sw-limits")"; rc=$?; printf '%s\n' "$out"
      [ "$rc" -eq 0 ] && [[ "$out" == *"WYNIK: OK"* ]]

  - id: fix-app
    type: agent
    name: Inżynier (poprawka po przeglądzie bezpieczeństwa aplikacji)
    skill: sw-inzynier
    runner: claude
    model: opus
    prompt: |
      Wczytaj skill sw-inzynier i pracuj w trybie poprawka: problemy z przeglądu bezpieczeństwa
      pełnej aplikacji (runda poprawek {{nodes.rounds-app.iteration}} z {{nodes.rounds-app.max}}).
      Problemy są w .ai/sw-run/uwagi.md. Usuń przyczynę (funkcję z kategorii wykluczonych,
      sekret, adres bez uwierzytelnienia, rejestrację kont albo formularz zbierający dane osób
      trzecich) razem z testami, które na niej polegają. Poprawka trafia do nowego PR, który
      przechodzi recenzję, CI i przegląd bezpieczeństwa; testy E2E i przegląd aplikacji powtarzają się.

      Zadanie: {{task}}
    allowedTools: [Read, Write, Edit, Bash]
    bashAllowlist:
      - "gh issue view"
      - "gh pr checks"
      - "ls"
      - "cat"
      - "mkdir"
      - "chmod"
      - "git ls-files"
      - "bash scripts/"
    verdicts: [gotowa]

  - id: pause-rounds-app
    type: check
    name: Wstrzymanie projektu po wyczerpaniu rund poprawek po przeglądzie aplikacji
    command: |
      bash "${SW_HOME:-$HOME/swarm-of-agents}/bin/sw-spec-pr" pause 'przegląd bezpieczeństwa aplikacji: fail po wyczerpaniu rund poprawek'

  - id: pause-rounds-mod
    type: check
    name: Wstrzymanie projektu po wyczerpaniu rund poprawek modułu
    command: |
      bash "${SW_HOME:-$HOME/swarm-of-agents}/bin/sw-spec-pr" pause 'moduł: uwagi albo czerwone CI po wyczerpaniu rund poprawek'

  - id: pause-security-mod
    type: check
    name: Wstrzymanie projektu po porażce przeglądu bezpieczeństwa modułu
    command: |
      bash "${SW_HOME:-$HOME/swarm-of-agents}/bin/sw-spec-pr" pause 'przegląd bezpieczeństwa modułu: fail'

  - id: pause-rounds-test
    type: check
    name: Wstrzymanie projektu po wyczerpaniu rund poprawek po testach E2E
    command: |
      bash "${SW_HOME:-$HOME/swarm-of-agents}/bin/sw-spec-pr" pause 'testy E2E aplikacji: porażki albo brak pokrycia po wyczerpaniu rund poprawek'

  - id: pause-rounds-integ
    type: check
    name: Wstrzymanie projektu po wyczerpaniu rund poprawek po konflikcie modułów
    command: |
      bash "${SW_HOME:-$HOME/swarm-of-agents}/bin/sw-spec-pr" pause 'integracja modułów: konflikt po wyczerpaniu rund poprawek'

  - id: state-deploy
    type: check
    name: Stan projektu - wdrażanie
    command: bash "${SW_HOME:-$HOME/swarm-of-agents}/bin/sw-stan" przeglad wdrazanie

  - id: limits-deploy
    type: check
    name: Limity projektu (przed wdrożeniem)
    command: |
      out="$(bash "${SW_HOME:-$HOME/swarm-of-agents}/bin/sw-limits")"; rc=$?; printf '%s\n' "$out"
      [ "$rc" -eq 0 ] && [[ "$out" == *"WYNIK: OK"* ]]

  - id: deploy
    type: check
    name: Wdrożenie na VPS pod prywatnym adresem i test odmowy bez logowania (sw-deploy)
    command: bash "${SW_HOME:-$HOME/swarm-of-agents}/bin/sw-deploy"

  - id: finish
    type: check
    name: Stan wdrożony i powiadomienie właściciela (sw-wdrozony)
    command: bash "${SW_HOME:-$HOME/swarm-of-agents}/bin/sw-wdrozony"

  - id: rounds-deploy
    type: loop
    name: Ponowienia wdrożenia
    max: 2

  - id: pause-deploy
    type: check
    name: Wstrzymanie projektu po nieudanym wdrożeniu
    command: |
      bash "${SW_HOME:-$HOME/swarm-of-agents}/bin/sw-spec-pr" pause 'wdrożenie: nieudane po wyczerpaniu ponowień'

  - id: done
    type: end
    name: Aplikacja wdrożona pod prywatnym adresem, właściciel powiadomiony, projekt w stanie wdrożony
    status: success

  - id: stopped
    type: end
    name: Zatrzymane bez merge'u
    status: success

